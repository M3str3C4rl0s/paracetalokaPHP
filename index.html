<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FARMÁCIA PARACETALOKA</title>
</head>
<body>
    <div>
        <h1>FARMÁCIA PARACETALOKA</h1>
        <hr>
        <form action="calcular.php" method="post">
            <p>
                <label for="nome">
                    Nome:
                </label>
                <input type="text" name="nome" id="nome" required>
            </p>
            <p>
                <label for="total">
                    Total do Pedido:
                </label>
                <input type="text" name="total" id="total" required>
            </p>
            <p>
                <label for="idade">Faixa Etária:</label>
                <br>
                <input type="radio" name="idade" id="idade" value="0" required> Menor que 50 anos
                <br>
                <input type="radio" name="idade" id="idade" value="1"> entre 51 e 70
                <br>
                <input type="radio" name="idade" id="idade" value="2"> Maior que 70 anos                
            </p>
            <p>
                <input type="checkbox" name="cartao" id="cartao"> Cartão Fidelidade                
            </p>
            <p>
                <input type="submit" value="Calcular">
                <input type="reset" value="Limpar">
            </p>

        </form>
    </div>
    
</body>
</html>
